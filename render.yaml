databases:
  - name: woodshed-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: woodshed
    runtime: docker
    plan: free
    rootDir: Woodshed
    dockerfilePath: ./Dockerfile
    envVars:
      - key: WOODSHED_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: woodshed-db
          property: connectionString
